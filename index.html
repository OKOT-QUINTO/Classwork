<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Classwork Analysis</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="icon" id="fav">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5b2a86">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f1f8;--card:#fff;--tx:#241a33;--mu:#6f6580;--ac:#5b2a86;--ac2:#7e4bb0;--tint:#efe8f7;--bd:#e0d8ea;--ok:#177a3c;--bad:#c0392b;--st:#a0680a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171120;--card:#221a30;--tx:#ece6f5;--mu:#a79cba;--ac:#a77ddb;--ac2:#8d5fc4;--tint:#2f2342;--bd:#382d4d;--ok:#4cc27a;--bad:#ff7b6b;--st:#e3b04b}}
:root[data-theme="dark"]{--bg:#171120;--card:#221a30;--tx:#ece6f5;--mu:#a79cba;--ac:#a77ddb;--ac2:#8d5fc4;--tint:#2f2342;--bd:#382d4d;--ok:#4cc27a;--bad:#ff7b6b;--st:#e3b04b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
header{padding:22px 18px;text-align:center;background:linear-gradient(135deg,#3d1766,#6b35a0);color:#fff}header h1{margin:0;font-size:28px;letter-spacing:.5px;font-weight:700}header small{display:block;margin-top:5px;font-size:14px;opacity:.9}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
nav button.on{background:var(--ac);color:#fff}
main{padding:14px 12px 28px;max-width:1040px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #3d176614}
h2{margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--tint);font-size:18px;color:var(--ac)}label{display:block;font-size:11.5px;color:var(--mu);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;margin:10px 6px 0 0;font:inherit;font-weight:600}.btn.s{background:var(--tint);color:var(--ac)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:11.5px;color:var(--ac);background:var(--tint);text-transform:uppercase;letter-spacing:.4px}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}.sa{color:var(--st);font-weight:600}.mi{color:var(--bad)}
.k{font-size:24px;font-weight:700;color:var(--ac)}.bar{height:8px;background:var(--ac2);border-radius:4px}
.rep{background:var(--tint);border-left:4px solid var(--ac);padding:12px;border-radius:6px;line-height:1.6}
.mk{cursor:pointer;width:90px;text-align:center;font-weight:600}.ck{display:inline-flex;gap:4px;align-items:center;margin:4px 10px 0 0;font-size:12.5px}.ck input{width:auto}
#dlg,#pdlg,#mdlg{position:fixed;inset:0;background:#1a0b2e99;display:none;align-items:center;justify-content:center;z-index:9}
#dlg .b,#pdlg .b,#mdlg .b{background:var(--card);padding:16px;border-radius:12px;max-width:340px;width:94%}
#sl{max-height:110px;overflow:auto;border:1px solid var(--bd);border-radius:6px;margin-top:4px}#sl div{padding:6px 9px;cursor:pointer;border-bottom:1px solid var(--bd)}#sl div:hover{background:var(--tint)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.pad button{padding:14px 0;font-size:19px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;cursor:pointer}
.pad .ok{background:var(--ac);color:#fff}.x{background:none;border:0;color:var(--bad);cursor:pointer}.row{display:flex;gap:6px;flex-wrap:wrap}
.logo{width:62px;height:62px;border-radius:15px;box-shadow:0 2px 10px #0005;margin-bottom:6px}
#dlg,#pdlg,#mdlg{backdrop-filter:blur(2px)}#mdlg{z-index:12}#dlg .b,#pdlg .b,#mdlg .b{box-shadow:0 20px 50px #1a0b2e66;border-radius:16px;overflow:hidden}
#dt,#pdlg .b h2,#mdlg .b h2{display:block;margin:-16px -16px 14px;padding:14px 16px;background:linear-gradient(135deg,#3d1766,#6b35a0);color:#fff;font-size:16px;border:0}
#mdlg .b p{margin:0 0 6px;font-size:14px;line-height:1.5}#sq{border-radius:20px}
.pad button{border-radius:10px;font-weight:600;box-shadow:0 1px 2px #3d176622}.pad button:hover{background:var(--tint)}.pad .ok{background:linear-gradient(135deg,#5b2a86,#7e4bb0)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}button,a,select,input,label{touch-action:manipulation}
@media (max-width:900px){input,select,textarea{font-size:16px!important}}
.chip{display:inline-flex;gap:9px;align-items:center;background:var(--tint);border-radius:16px;padding:4px 12px;margin:0 6px 6px 0}.chip a{cursor:pointer;color:var(--ac)}.chip a.dn{color:var(--bad)}
</style></head><body>

L('ASSESSMENT COMPLETION RATE',d.comp.map(c=>`${c[0]}: ${c[1]} of ${c[2]} (${c[3].toFixed(0)}%)`)),L('RESULTS BY GENDER',d.gen.map(g=>`${g[0]}: ${g[1]} learners, average ${pf1(g[2])}, ${abl(g[2])}`)),L('RESULTS BY CLASS',d.cls.map(c=>`${c[0]}: ${c[1]} learners, average ${pf1(c[2])}, ${abl(c[2])}`)),

function vSearch(){return`<div class="card"><h2>Search learner results</h2><input placeholder="Type a learner's name…" value="${esc(ctx.q||'')}" oninput="ctx.q=this.value;sr()"></div><div id="sr"></div>`}
function sr(){const q=(ctx.q||'').toLowerCase().trim(),L=q?S.learners.filter(l=>l.sch==ctx.sch&&l.name.toLowerCase().includes(q)):[];
document.getElementById('sr').innerHTML=L.map(l=>`<div class="card w"><h2>${esc(l.name)}</h2><small>${esc(l.cls)} (${esc(l.year)}) · Parent: ${esc(l.parent)} (${esc(l.contact)}) · Age ${age(l.dob)} · Repeater: ${l.rep}</small>
<table><tr><th>Term</th><th>Subject</th><th>Series</th><th>Assessment</th><th>Marks</th><th>Comment</th></tr>${S.asg.filter(a=>a.sch==l.sch&&a.cls==l.cls&&a.year==l.year).sort((a,b)=>a.date.localeCompare(b.date)).map(a=>{const v=S.marks[a.id]?.[l.id];return`<tr><td>${esc(a.term)}</td><td>${esc(a.subject)}</td><td>${tname(a)}</td><td>${esc(a.name)}</td><td>${v==null?'<span class="mi">missed</span>':v+' / '+a.exp}</td><td>${v==null?'–':cm(v/a.exp*100)}</td></tr>`}).join('')}</table></div>`).join('')||(q?'<div class="card">No match.</div>':'')}
function vSetup(){const c=CS(),f=(k,l,o)=>`<div><label>${l}</label><input id="${k}" value="${esc(o)}"></div>`;
return`<div class="card"><h2>School details</h2>${bar()}<div class="g">${f('sn','School name',c.name)}${f('sh','Headteacher',c.head)}${f('sc',"Headteacher's contact",c.hc)}</div>
<button class="btn" onclick="Object.assign(CS(),{name:sn.value,head:sh.value,hc:sc.value});save();render()">Save school</button><button class="btn s" onclick="delSchool()">Delete this school</button></div>
<div class="card"><h2>Add school</h2><div class="g">${f('ns','School name','')}${f('nh','Headteacher','')}${f('nc',"Headteacher's contact",'')}</div><button class="btn" onclick="if(ns.value.trim()){const s={id:uid(),name:ns.value.trim(),head:nh.value,hc:nc.value};S.schools.push(s);ctx.sch=s.id;save();render()}">Add school</button></div>
<div class="card"><h2>Academic years</h2>${chips('years')}<div class="g">${f('ny','New academic year','')}</div>
<label class="ck" style="margin-top:8px"><input type="checkbox" id="cp">Also copy learners of ${esc(ctx.year)} into the new year (optional)</label><br><button class="btn" onclick="addY()">Add year</button></div>
<div class="card"><h2>Classes & subjects</h2><label>Classes</label>${chips('classes')}<label>Subjects</label>${chips('subjects')}<div class="g">${f('xc','New class','')}${f('xs','New subject','')}</div>
<button class="btn" onclick="if(xc.value.trim())S.classes.push(xc.value.trim());if(xs.value.trim())S.subjects.push(xs.value.trim());save();render()">Add</button></div>
<div class="card"><h2>Cloud database (Supabase)</h2>${SB?'<p style="margin:0">Connected. Every signed-in device sees the same learners, assessments and marks.</p>':`<p style="margin:0 0 8px">Not connected: data is kept only in this browser. Paste your Supabase details to connect.</p><div class="g"><div><label>Project URL</label><input id="sbu" placeholder="https://xxxx.supabase.co" autocapitalize="none"></div><div><label>Anon public key</label><input id="sbk" autocapitalize="none"></div></div><button class="btn" onclick="if(sbu.value.trim()&&sbk.value.trim()){localStorage.setItem('sbcfg',JSON.stringify({url:sbu.value.trim(),key:sbk.value.trim()}));location.reload()}">Save and connect</button>`}</div>
<div class="card"><h2>Backup & restore</h2><p style="margin:0 0 4px">Your records are stored in your Supabase database when connected (otherwise only in this browser). Download a backup regularly as well.</p>
<button class="btn" onclick="backup()">Download backup</button><label class="btn s" style="display:inline-block;cursor:pointer;margin:10px 0 0">Restore from backup<input type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></label></div>
<div class="card"><h2>Data</h2><button class="btn s" onclick="ask('Delete ALL learners, assessments and marks? This cannot be undone.',()=>{S.learners=[];S.asg=[];S.marks={};save();render()})">Clear all learners and results</button></div>`}
async function backup(){const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),fn=uniq('Backup.json');let dl=null;try{dl=await claude.use('downloads')}catch(e){}
try{if(dl)await dl.save({filename:fn,data:blob});else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;a.click()}}catch(e){if(e&&e.code!='declined')alert('Backup failed: '+(e.message||e))}}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.schools||!d.learners||!d.asg||!d.marks)throw 0;ask('Replace ALL current data with this backup?',()=>{S=d;save();ctx={sch:S.schools[0].id,year:S.years[0],term:'Term 1',cls:S.learners[0]?.cls||S.classes[0]};render()})}catch(e){alert('This file is not a valid backup.')}};r.readAsText(f)}
const chips=k=>`<p style="margin:0 0 8px">${S[k].map((c,i)=>`<span class="chip">${esc(c)}<a onclick="renItem('${k}',${i})" title="Rename">✎</a><a class="dn" onclick="delItem('${k}',${i})" title="Delete">✕</a></span>`).join('')}</p>`;
function form(title,F,ok){mdlg.innerHTML=`<div class="b" style="max-width:430px"><h2>${esc(title)}</h2><div class="g" style="grid-template-columns:1fr 1fr;max-height:58vh;overflow:auto;padding:2px">${F.map((f,i)=>`<div style="${f.w?'grid-column:1/-1':''}"><label>${f.l}</label>${f.o?`<select id="ff${i}">${O(f.o,f.v)}</select>`:`<input id="ff${i}" type="${f.t||'text'}" value="${esc(f.v)}">`}</div>`).join('')}</div>
<p id="ferr" style="color:var(--bad);margin:8px 0 0;min-height:18px"></p><button class="btn" id="fsave" style="margin:6px 6px 0 0">Save changes</button><button class="btn s" style="margin:6px 0 0" onclick="mdlg.style.display='none'">Cancel</button></div>`;mdlg.style.display='flex';
document.getElementById('fsave').onclick=()=>{const e=ok(F.map((f,i)=>document.getElementById('ff'+i).value));if(e)document.getElementById('ferr').textContent=e;else mdlg.style.display='none'}}
function editL(id){const l=S.learners.find(x=>x.id==id);form('Edit learner',[{l:'Name',v:l.name,w:1},{l:'Gender',o:['Female','Male','Not set'],v:l.gender||'Not set'},{l:'Class',o:S.classes,v:l.cls},{l:'Academic year',o:S.years,v:l.year},{l:'Repeater',o:['No','Yes'],v:l.rep||'No'},{l:'Date of birth',t:'date',v:l.dob||''},{l:'Parent name',v:l.parent||'',w:1},{l:'Parent contact',v:l.contact||''},{l:'Social needs',v:l.needs||''}],
v=>{if(!v[0].trim())return'Name cannot be empty';Object.assign(l,{name:v[0].trim(),gender:v[1],cls:v[2],year:v[3],rep:v[4],dob:v[5],parent:v[6],contact:v[7],needs:v[8]});save();render()})}
function editA(id){const a=S.asg.find(x=>x.id==id),mx=Math.max(0,...Object.values(S.marks[id]||{}));form('Edit assessment',[{l:'Assessment name',v:a.name,w:1},{l:'Subject',o:[...new Set([...S.subjects,a.subject])],v:a.subject},{l:'Week',o:Array.from({length:15},(_,i)=>'Week '+(i+1)),v:'Week '+(a.week||1)},{l:'Class',o:S.classes,v:a.cls},{l:'Term',o:T,v:a.term},{l:'Academic year',o:S.years,v:a.year},{l:'Date given',t:'date',v:a.date},{l:'Expected marks',t:'number',v:a.exp},{l:'Subject teacher',v:a.teacher||'',w:1},{l:"Teacher's contact",v:a.tc||'',w:1}],
v=>{if(!v[0].trim()||!v[6])return'Enter the assessment name and the date';const e=+v[7];if(!(e>=1))return'Expected marks must be 1 or more';if(e<mx)return`Some learners already have marks up to ${mx}, so expected marks cannot be lower than that.`;
Object.assign(a,{name:v[0].trim(),subject:v[1],week:v[2].replace('Week ',''),cls:v[3],term:v[4],year:v[5],date:v[6],exp:e,teacher:v[8],tc:v[9]});save();render()})}
function clrM(a,l){if(S.marks[a]?.[l]==null)return;ask('Clear this mark?',()=>{delete S.marks[a][l];save();render()})}
function clrAll(a){ask('Clear ALL marks for this assessment?',()=>{S.marks[a]={};save();render()})}
function renItem(k,i){const o=S[k][i];form('Rename',[{l:'New name',v:o,w:1}],v=>{const n=v[0].trim();if(!n)return'Enter a name';if(S[k].some((x,j)=>j!=i&&x==n))return'That name already exists';S[k][i]=n;
if(k=='classes'){S.learners.forEach(l=>{if(l.cls==o)l.cls=n});S.asg.forEach(a=>{if(a.cls==o)a.cls=n});if(ctx.cls==o)ctx.cls=n}
if(k=='subjects')S.asg.forEach(a=>{if(a.subject==o)a.subject=n});
if(k=='years'){S.learners.forEach(l=>{if(l.year==o)l.year=n});S.asg.forEach(a=>{if(a.year==o)a.year=n});if(ctx.year==o)ctx.year=n}save();render()})}
function delItem(k,i){const o=S[k][i],f={classes:x=>x.cls==o,subjects:x=>x.subject==o,years:x=>x.year==o},n=(k=='subjects'?0:S.learners.filter(f[k]).length)+S.asg.filter(f[k]).length;
if(k!='subjects'&&S[k].length<2)return alert('Keep at least one entry in this list.');if(n)return alert(`"${o}" is used by ${n} record(s). Rename it instead, or delete those records first.`);
ask(`Delete "${o}" from the list?`,()=>{S[k].splice(i,1);if(k=='classes'&&ctx.cls==o)ctx.cls=S.classes[0];if(k=='years'&&ctx.year==o)ctx.year=S.years[0];save();render()})}
function delSchool(){if(S.schools.length<2)return alert('You cannot delete the only school. Edit its details instead.');const c=CS();ask(`Delete ${c.name} with all its learners, assessments and marks? This cannot be undone.`,()=>{S.asg.filter(a=>a.sch==c.id).forEach(a=>delete S.marks[a.id]);S.asg=S.asg.filter(a=>a.sch!=c.id);S.learners=S.learners.filter(l=>l.sch!=c.id);S.schools=S.schools.filter(x=>x.id!=c.id);ctx.sch=S.schools[0].id;save();render()})}
function addY(){const y=ny.value.trim();if(!y||S.years.includes(y))return alert('Enter a new year');const old=ctx.year;S.years.push(y);if(cp.checked)LI0(old).forEach(l=>S.learners.push({...l,id:uid(),year:y}));ctx.year=y;save();render()}
const LI0=y=>S.learners.filter(l=>l.sch==ctx.sch&&l.year==y);
boot();
</script></body></html>
