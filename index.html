<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ANALYSER</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<meta name="apple-mobile-web-app-title" content="ANALYSER">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" id="fav">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b2a86">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f1f8;--card:#fff;--tx:#241a33;--mu:#6f6580;--ac:#5b2a86;--ac2:#7e4bb0;--tint:#efe8f7;--bd:#e0d8ea;--ok:#177a3c;--bad:#c0392b;--st:#a0680a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171120;--card:#221a30;--tx:#ece6f5;--mu:#a79cba;--ac:#a77ddb;--ac2:#8d5fc4;--tint:#2f2342;--bd:#382d4d;--ok:#4cc27a;--bad:#ff7b6b;--st:#e3b04b}}
:root[data-theme="dark"]{--bg:#171120;--card:#221a30;--tx:#ece6f5;--mu:#a79cba;--ac:#a77ddb;--ac2:#8d5fc4;--tint:#2f2342;--bd:#382d4d;--ok:#4cc27a;--bad:#ff7b6b;--st:#e3b04b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
header{padding:22px 18px;text-align:center;background:linear-gradient(135deg,#3d1766,#6b35a0);color:#fff}header h1{margin:0;font-size:28px;letter-spacing:.5px;font-weight:700}header small{display:block;margin-top:5px;font-size:14px;opacity:.9}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
nav button.on{background:var(--ac);color:#fff}
main{padding:14px 12px 28px;max-width:1040px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #3d176614}
h2{margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--tint);font-size:18px;color:var(--ac)}label{display:block;font-size:11.5px;color:var(--mu);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;margin:10px 6px 0 0;font:inherit;font-weight:600}.btn.s{background:var(--tint);color:var(--ac)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:11.5px;color:var(--ac);background:var(--tint);text-transform:uppercase;letter-spacing:.4px}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}.sa{color:var(--st);font-weight:600}.mi{color:var(--bad)}
.k{font-size:24px;font-weight:700;color:var(--ac)}.bar{height:8px;background:var(--ac2);border-radius:4px}
.rep{background:var(--tint);border-left:4px solid var(--ac);padding:12px;border-radius:6px;line-height:1.6}
.mk{cursor:pointer;width:90px;text-align:center;font-weight:600}.ck{display:inline-flex;gap:4px;align-items:center;margin:4px 10px 0 0;font-size:12.5px}.ck input{width:auto}
#dlg,#pdlg,#mdlg{position:fixed;inset:0;background:#1a0b2e99;display:none;align-items:center;justify-content:center;z-index:9}
#dlg .b,#pdlg .b,#mdlg .b{background:var(--card);padding:16px;border-radius:12px;max-width:340px;width:94%}
#sl{max-height:110px;overflow:auto;border:1px solid var(--bd);border-radius:6px;margin-top:4px}#sl div{padding:6px 9px;cursor:pointer;border-bottom:1px solid var(--bd)}#sl div:hover{background:var(--tint)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.pad button{padding:14px 0;font-size:19px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;cursor:pointer}
.pad .ok{background:var(--ac);color:#fff}.x{background:none;border:0;color:var(--bad);cursor:pointer}.row{display:flex;gap:6px;flex-wrap:wrap}
.logo{width:62px;height:62px;border-radius:15px;box-shadow:0 2px 10px #0005;margin-bottom:6px}
#dlg,#pdlg,#mdlg{backdrop-filter:blur(2px)}#mdlg{z-index:12}#dlg .b,#pdlg .b,#mdlg .b{box-shadow:0 20px 50px #1a0b2e66;border-radius:16px;overflow:hidden}
#dt,#pdlg .b h2,#mdlg .b h2{display:block;margin:-16px -16px 14px;padding:14px 16px;background:linear-gradient(135deg,#3d1766,#6b35a0);color:#fff;font-size:16px;border:0}
#mdlg .b p{margin:0 0 6px;font-size:14px;line-height:1.5}#sq{border-radius:20px}
.pad button{border-radius:10px;font-weight:600;box-shadow:0 1px 2px #3d176622}.pad button:hover{background:var(--tint)}.pad .ok{background:linear-gradient(135deg,#5b2a86,#7e4bb0)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}button,a,select,input,label{touch-action:manipulation}
@media (max-width:900px){input,select,textarea{font-size:16px!important}}
.chip{display:inline-flex;gap:9px;align-items:center;background:var(--tint);border-radius:16px;padding:4px 12px;margin:0 6px 6px 0}.chip a{cursor:pointer;color:var(--ac)}.chip a.dn{color:var(--bad)}
</style></head><body>

/* ===== examinations ===== */
S.exams=[];S.em={};
const DIVS=['1','2','3','4','U','X'],ORD=[0,1,2,12,3,4,5,6,7,8,9,10,11];
const DEFSUBS=()=>[{name:'Mathematics',short:'MTC',count:true,core:true},{name:'Social Studies',short:'SST',count:true,core:true},{name:'Science',short:'SCI',count:true,core:true},{name:'English',short:'ENG',count:true,core:true}];
const normCfg=c=>{c=c&&typeof c=='object'?c:{};c.subjects=(c.subjects&&c.subjects.length)?c.subjects:DEFSUBS();c.grades=c.grades||[];c.divs=c.divs||[];
if(!c.push)c.push={agg:9,to:'none',subs:['English','Mathematics'],rules:[]};
if(!Array.isArray(c.push.rules))c.push.rules=[];
/* migrate single push into rules if present and rules empty */
if(c.push.to&&c.push.to!='none'&&!c.push.rules.length)c.push.rules=[{to:c.push.to,agg:+(c.push.agg||9),subs:c.push.subs||['English','Mathematics'],onlyFrom:c.push.to=='2'?['1']:null}];
return c};
const ISCT=cls=>!!ME&&(ME.role=='admin'||ME.role=='headteacher'||TEACH.some(t=>t.class_name==cls&&!t.subject));
const canEnter=(cls,sub)=>!!ME&&(FULL()||TEACH.some(t=>t.class_name==cls&&(!t.subject||t.subject==sub)));
const XL=()=>S.exams.filter(e=>e.sch==ctx.sch&&e.year==ctx.year&&e.term==ctx.term&&e.cls==ctx.cls).sort((a,b)=>(b.cat||'').localeCompare(a.cat||''));
function CX(){const l=XL(),e=l.find(x=>x.id==ctx.x)||l[0];ctx.x=e?.id;return e}
const gradeOf=(e,v)=>{if(v==null)return null;const p=Math.round(v/e.exp*100),g=e.cfg.grades.find(r=>p>=r.from&&p<=r.to);return g?+g.agg:'?'};
function sheetRows(e){const c=e.cfg,sb=c.subjects;const rules=(c.push&&c.push.rules&&c.push.rules.length)?c.push.rules:(c.push&&c.push.to&&c.push.to!='none'?[{to:c.push.to,agg:+(c.push.agg||9),subs:c.push.subs||[],onlyFrom:c.push.to=='2'?['1']:null}]:[]);
const R=LI().map(l=>{const m=S.em[e.id]?.[l.id]||{},cells=sb.map(s=>({v:m[s.name],a:gradeOf(e,m[s.name]),n:s.count})),ct=cells.filter(x=>x.n),miss=ct.some(x=>x.v==null),unk=ct.some(x=>x.a=='?');
const tagg=(miss||unk)?null:ct.reduce((t,x)=>t+x.a,0);let div=miss?'X':unk?'?':(c.divs.find(r=>tagg>=r.from&&tagg<=r.to)?.div||'U');
if(!miss&&!unk){rules.forEach(ru=>{const hit=sb.some((s,i)=>(ru.subs||[]).includes(s.name)&&cells[i].a===+(ru.agg||9));
if(hit&&(!ru.onlyFrom||ru.onlyFrom.includes(div))&&DIVS.indexOf(String(ru.to))>DIVS.indexOf(div))div=String(ru.to)})}
return{l,cells,tagg,div,tot:cells.reduce((t,x)=>t+(x.v??0),0)}});
R.sort(c.rank===false?(a,b)=>a.l.name.localeCompare(b.l.name):(a,b)=>(a.tagg??1e9)-(b.tagg??1e9)||a.l.name.localeCompare(b.l.name));return R}

const AGG_LABELS={1:'D1',2:'D2',3:'C3',4:'C4',5:'C5',6:'C6',7:'P7',8:'P8',9:'F9'};
/* ================= EXAMINATION ANALYSES (v5) ================= */
const AGS=[1,2,3,4,5,6,7,8,9],DV6=['1','2','3','4','U','X'];
const isM=l=>String(l.gender||'').toLowerCase()==='male',isF=l=>String(l.gender||'').toLowerCase()==='female';
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hc=(t,cs,rs)=>({content:t,colSpan:cs||1,rowSpan:rs||1});
const f1=v=>v==null?'–':v.toFixed(1),sg=(n,dp)=>(Math.abs(n)<1e-9?'':n>0?'+':'')+n.toFixed(dp||0);
const curE=()=>{const e=CX();if(!e)alert('No examination selected');return e};
const DVCOL={'1':'#4a1d78','2':'#7e4bb0','3':'#a77ddb','4':'#d1b8ee','U':'#e3b04b','X':'#c0392b','ABS':'#9a9a9a'};
const AGCOL={1:'#2e7d32',2:'#66a83a',3:'#a5c93d',4:'#e0c341',5:'#f0a030',6:'#e97b2b',7:'#d9532f',8:'#b8322a',9:'#7a1f1f'};

function examAnalysis(e){const R=sheetRows(e),c=e.cfg,sb=c.subjects;
const none=r=>r.cells.every(x=>x.v==null),dv=r=>none(r)?'ABS':(DV6.includes(r.div)?r.div:'U');
const divCnt={};DV6.forEach(d=>divCnt[d]=0);let abs=0;
R.forEach(r=>{const k=dv(r);if(k=='ABS')abs++;else divCnt[k]++});
const gen={divs:DV6,divCnt,abs,total:R.length};
const subA=sb.map((s,i)=>{const counts={},cm={},cf={};AGS.forEach(a=>{counts[a]=0;cm[a]=0;cf[a]=0});let ab=0;
R.forEach(r=>{const x=r.cells[i];if(x.v==null)ab++;else if(typeof x.a=='number'&&x.a>=1&&x.a<=9){counts[x.a]++;if(isM(r.l))cm[x.a]++;else if(isF(r.l))cf[x.a]++}});
return{name:s.name,short:s.short,counts,cm,cf,abs:ab,sat:AGS.reduce((t,a)=>t+counts[a],0),total:R.length}});
/* gender x division: learners absent for the whole exam are counted under X so that totals equal the class size */
const gd={M:{},F:{},N:{}};Object.keys(gd).forEach(g=>DV6.forEach(d=>gd[g][d]=0));
R.forEach(r=>{const g=isM(r.l)?'M':isF(r.l)?'F':'N',k=dv(r);gd[g][k=='ABS'?'X':k]++});
return{R,gen,subA,gd,grades:c.grades||[],divsScale:c.divs||[],push:c.push||{}}}

/* division scale notes: same condition the push engine uses */
function divScaleRows(A){const rules=(A.push&&A.push.rules)||[];
return(A.divsScale||[]).map(r=>{const notes=[];
rules.forEach(ru=>{if(!(DIVS.indexOf(String(ru.to))>DIVS.indexOf(String(r.div))))return;if(ru.onlyFrom&&!ru.onlyFrom.includes(String(r.div)))return;
const subs=(ru.subs||[]).join(', ')||'selected subjects',lab=AGG_LABELS[+ru.agg||9]||'F9',t=`Without ${lab} in ${subs}`;if(!notes.includes(t))notes.push(t)});
return['DIV '+r.div,r.from,r.to,notes.join('; ')]})}

function tblHtml(head,body,o={}){const cell=c=>typeof c=='object'&&c!==null?c:{content:c},lf=o.left||[0],last=body[body.length-1];
return`<table style="${o.w?'width:'+o.w:'width:100%'};text-align:center">${head.map(r=>`<tr>${r.map(c=>{c=cell(c);return`<th style="text-align:center" colspan="${c.colSpan||1}" rowspan="${c.rowSpan||1}">${esc(c.content)}</th>`}).join('')}</tr>`).join('')}${body.map(r=>`<tr>${r.map((c,i)=>`<td style="text-align:${lf.includes(i)?'left':'center'}${i==0&&lf.includes(0)?';font-weight:700':''}${(o.wrap||[]).includes(i)?';white-space:normal;min-width:230px':''}${o.lastBold&&r===last?';font-weight:700;background:var(--tint)':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`}
const h3=t=>`<div style="font-weight:700;color:var(--ac);text-align:center;margin:12px 0 5px;font-size:15px">${esc(t)}</div>`;
function showRep(title,inner,pdfCall,w,lab){mdlg.innerHTML=`<div class="b" style="max-width:${w||1100}px;max-height:90vh;overflow:auto"><h2>${esc(title)}</h2><div style="overflow-x:auto;font-size:13.5px">${inner}</div><button class="btn" onclick="${pdfCall}">Download PDF (${lab||'landscape'})</button><button class="btn s" onclick="mdlg.style.display='none'">Close</button></div>`;mdlg.style.display='flex'}
const repTop=e=>`<div style="text-align:center;margin-bottom:6px"><div style="font-size:20px;font-weight:700;color:var(--ac)">${esc(CS().name)}</div><div>${esc(e.term)}, Academic year ${esc(e.year)}</div><div style="font-weight:700">${esc(e.name)} ${esc(e.cls)}</div></div>`;

/* ---- shared table definitions (screen and PDF use the same data) ---- */
function genTable(A){const g=A.gen;return{head:[['DIVISION',...g.divs.map(d=>'DIV '+d),'ABS','TOTAL']],body:[['NO. OF PUPILS',...g.divs.map(d=>g.divCnt[d]||0),g.abs,g.total]]}}
function subTable(A){return{head:[['SUBJECT',...AGS.map(a=>AGG_LABELS[a]),'ABS','TOTAL']],body:A.subA.map(s=>[s.name,...AGS.map(a=>s.counts[a]),s.abs,s.total])}}
function gdTable(A){const sum=(o)=>DV6.reduce((t,d)=>t+o[d],0),rows=[['MALE',...DV6.map(d=>A.gd.M[d]),sum(A.gd.M)],['FEMALE',...DV6.map(d=>A.gd.F[d]),sum(A.gd.F)]];
if(sum(A.gd.N))rows.push(['NOT SET',...DV6.map(d=>A.gd.N[d]),sum(A.gd.N)]);
rows.push(['TOTAL',...DV6.map(d=>A.gd.M[d]+A.gd.F[d]+A.gd.N[d]),sum(A.gd.M)+sum(A.gd.F)+sum(A.gd.N)]);
return{head:[['DIVISION',...DV6.map(d=>'DIV '+d),'TOTAL']],body:rows,notSet:!!sum(A.gd.N)}}
function sgTable(A){const body=A.subA.map(s=>[s.name,...AGS.flatMap(a=>[s.cm[a],s.cf[a]]),s.sat]);
body.push(['ALL SUBJECTS',...AGS.flatMap(a=>[A.subA.reduce((t,s)=>t+s.cm[a],0),A.subA.reduce((t,s)=>t+s.cf[a],0)]),A.subA.reduce((t,s)=>t+s.sat,0)]);
return{head:[[hc('SUBJECT',1,2),...AGS.map(a=>hc(AGG_LABELS[a],2)),hc('TOTAL',1,2)],AGS.flatMap(()=>['M','F'])],body}}
function scaleTables(A){return{g:{head:[['From %','To %','Aggregate','Grade']],body:(A.grades||[]).map(r=>[r.from,r.to,r.agg,AGG_LABELS[r.agg]||r.agg])},d:{head:[['Division','From T.AGG','To T.AGG','Note']],body:divScaleRows(A)}}}

/* ---- on-screen pages (each has its own button) ---- */
function openScales(){const e=curE();if(!e)return;const T=scaleTables(examAnalysis(e));
const g=T.g.body.length?tblHtml(T.g.head,T.g.body,{w:'auto',left:[]}):'<p style="color:var(--mu)">No grading set.</p>',d=T.d.body.length?tblHtml(T.d.head,T.d.body,{w:'auto',left:[0,3],wrap:[3]}):'<p style="color:var(--mu)">No divisions set.</p>';

function openGender(){const e=curE();if(!e)return;const A=examAnalysis(e),a=gdTable(A),b=sgTable(A);
showRep('Analysis by gender and by division',repTop(e)+h3('ANALYSIS BY GENDER AND DIVISION')+tblHtml(a.head,a.body,{lastBold:1})+'<p style="color:var(--mu);font-size:12px;margin:4px 0 0">DIV X includes learners who missed a subject or were absent for the whole examination.</p>'+h3('AGGREGATES BY GENDER (M = male, F = female)')+tblHtml(b.head,b.body,{lastBold:1}),'pdfGender()')}

/* ---- PDF helpers ---- */
function pdfBand(d,W,title,sub){d.setFillColor(91,42,134);d.rect(0,0,W,30,'F');d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(20);d.text(CS().name||'School',W/2,11,{align:'center'});d.setFontSize(12);d.text(sub,W/2,18,{align:'center'});d.setFontSize(13);d.text(title.toUpperCase(),W/2,26,{align:'center'});d.setFontSize(8.5);d.text('Printed: '+fd(iso(new Date())),W-10,26,{align:'right'});d.setTextColor(20)}
async function pdfSave(d,fn){fn=uniq(fn.replace(/\s+/g,'_'));const blob=d.output('blob');let dl=null;try{dl=await claude.use('downloads')}catch(x){}if(dl)await dl.save({filename:fn,data:blob});else d.save(fn)}
const fnOf=(e,t)=>`${t}_${e.name}_${e.cls}_${e.term}_${e.year}.pdf`;
/* landscape analysis page: sections = [[table,...]] ; tables inside one section sit side by side when they have x and w */
async function pdfLand(e,title,secs,fn){try{const J=window.jspdf;if(!J)return alert('PDF library did not load. Check your internet connection.');
const d=new J.jsPDF({orientation:'landscape'}),W=d.internal.pageSize.width,H=d.internal.pageSize.height;pdfBand(d,W,title,`${e.name} ${e.cls} · ${e.term}, ${e.year}`);let y=40;
secs.forEach(sec=>{if(y>H-50){d.addPage();y=16}let yEnd=y;
sec.forEach(tb=>{const side=tb.x!=null;d.setFont('helvetica','bold');d.setFontSize(13.5);d.setTextColor(91,42,134);d.text(tb.title,side?tb.x+tb.w/2:W/2,y,{align:'center'});
d.autoTable({startY:y+3,head:tb.head,body:tb.body,theme:'grid',margin:{left:side?tb.x:10,right:side?W-tb.x-tb.w:10},tableWidth:side?tb.w:'auto',
styles:{fontSize:13.5,cellPadding:1.8,halign:'center',valign:'middle',textColor:20,lineColor:[200,190,215],lineWidth:.2},headStyles:{fillColor:[91,42,134],textColor:255,fontStyle:'bold',halign:'center'},alternateRowStyles:{fillColor:[240,233,248]},columnStyles:tb.cs||{0:{halign:'left',fontStyle:'bold'}}});
yEnd=Math.max(yEnd,d.lastAutoTable.finalY);if(tb.note){d.setFont('helvetica','italic');d.setFontSize(11);d.setTextColor(90);d.text(tb.note,10,d.lastAutoTable.finalY+5);yEnd=Math.max(yEnd,d.lastAutoTable.finalY+6)}});
y=yEnd+10});
await pdfSave(d,fn)}catch(x){if(x&&x.code!='declined')alert('Could not save PDF: '+(x.message||x))}}

/* ---- doughnut charts ---- */
function svgDonut(data,sz,c2){const t=data.reduce((s,x)=>s+x.v,0),R=sz/2-4,th=sz*.17,rr=R-th/2,C=2*Math.PI*rr,m=sz/2;let acc=0,s=`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${m}" cy="${m}" r="${rr}" fill="none" stroke="#8884" stroke-width="${th}"/>`;
if(t)data.forEach(x=>{if(!x.v)return;const len=x.v/t*C;s+=`<circle cx="${m}" cy="${m}" r="${rr}" fill="none" stroke="${x.c}" stroke-width="${th}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${m} ${m})"/>`;acc+=len});
return s+`<text x="${m}" y="${m+2}" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ac)">${t}</text><text x="${m}" y="${m+17}" text-anchor="middle" font-size="11" fill="var(--mu)">${esc(c2)}</text></svg>`}
function legHtml(data){const t=data.reduce((s,x)=>s+x.v,0)||1;return`<div style="font-size:12.5px;line-height:1.6">${data.map(x=>`<div><span style="display:inline-block;width:10px;height:10px;background:${x.c};border-radius:2px;margin-right:6px"></span>${esc(x.l)}: <b>${x.v}</b> (${(x.v/t*100).toFixed(1)}%)</div>`).join('')}</div>`}
function pdfDonut(d,cx,cy,r,data,l1,l2){const t=data.reduce((s,x)=>s+x.v,0);
if(!t){d.setDrawColor(190);d.setLineWidth(.4);d.circle(cx,cy,r,'S');d.setFontSize(9);d.text('No data',cx,cy,{align:'center'});return}
let a=-Math.PI/2;const live=data.filter(x=>x.v).length;
data.forEach(x=>{if(!x.v)return;const sw=x.v/t*2*Math.PI,n=Math.max(2,Math.ceil(sw/.05)),rg=hex2(x.c);d.setFillColor(rg[0],rg[1],rg[2]);d.setDrawColor(rg[0],rg[1],rg[2]);d.setLineWidth(.1);
for(let i=0;i<n;i++){const a0=a+sw*i/n,a1=a+sw*(i+1)/n;d.triangle(cx,cy,cx+r*Math.cos(a0),cy+r*Math.sin(a0),cx+r*Math.cos(a1),cy+r*Math.sin(a1),'FD')}
if(live>1){d.setDrawColor(255,255,255);d.setLineWidth(.7);d.line(cx,cy,cx+r*Math.cos(a),cy+r*Math.sin(a))}a+=sw});
d.setFillColor(255,255,255);d.setDrawColor(255,255,255);d.circle(cx,cy,r*.58,'FD');
d.setTextColor(91,42,134);d.setFont('helvetica','bold');d.setFontSize(15);d.text(String(t),cx,cy+1,{align:'center'});d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(110);d.text(l2,cx,cy+5.5,{align:'center'});d.setTextColor(20)}

${R.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.l.name)}</td>${r.cells.map(x=>`<td>${x.v??'–'}</td><td><b>${x.a??'–'}</b></td>`).join('')}<td><b>${r.tagg??'–'}</b></td><td><b>${r.div}</b></td>${c.showTotal?`<td>${r.tot}</td>`:''}</tr>`).join('')}</table>`}

R.map((r,i)=>[i+1,r.l.name,...r.cells.flatMap(x=>[x.v??'-',x.a??'-']),r.tagg??'-',r.div,...(c.showTotal?[r.tot]:[])]),`MarkSheet_${e.name}_${e.cls}_${e.term}_${e.year}.pdf`.replace(/\s+/g,'_'),{land:1,fs:10,sub:`${e.term}, Academic year ${e.year}`})}

function vExam(){const e=CX(),mk=ISCT(ctx.cls);
let h=`<div class="card"><h2>Examination MarkSheet</h2>${bar()}${mk?`<div class="g" style="margin-top:6px"><div><label>Examination name</label><input id="xn" placeholder="e.g. End of Term Examination"></div><div><label>Expected marks per subject</label><input id="xe" type="number" value="100" min="1"></div></div><button class="btn" onclick="addExam()">Create examination</button>`:'<p style="color:var(--mu);margin:0">Only the class teacher and headteacher create examinations. Subject teachers enter marks for their own subject.</p>'}</div>`;

${mk?`<button class="btn" onclick="openGrades()">Set grading</button><button class="btn" onclick="openDivs()">Set divisions and push rules</button><button class="btn" onclick="openSubs()">Subjects</button><button class="btn s" onclick="editExam()">Edit examination</button><button class="btn s" onclick="delExam()">Delete examination</button>`:''}</div>
<div class="card w"><h2>Enter marks</h2><p style="margin:0 0 8px;color:var(--mu)">${mk||FULL()?'You can enter marks for every subject.':'You can enter marks only for your own subject.'}</p><table><tr><th>No.</th><th>Learner</th>${sb.map(s=>`<th>${esc(s.short)}</th>`).join('')}</tr>
${LI().map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}</td>${sb.map((s,si)=>{const v=S.em[e.id]?.[l.id]?.[s.name],ok=canEnter(e.cls,s.name);return`<td><input type="number" min="0" max="${e.exp}" value="${v??''}" ${ok?'':'disabled'} onchange="setXM('${e.id}','${l.id}',${si},this)" style="width:80px"></td>`}).join('')}</tr>`).join('')}</table></div>`;
if(sheetOk)h+=`<div class="card"><h2>MarkSheet</h2><label class="ck"><input type="checkbox" ${c.showTotal?'checked':''} onchange="optX('showTotal',this.checked)">Show overall total marks</label><label class="ck"><input type="checkbox" ${c.rank!==false?'checked':''} onchange="optX('rank',this.checked)">Rank by total aggregate (untick for alphabetical order)</label><br><button class="btn" onclick="pdfSheet(CX())">Download MarkSheet PDF</button><button class="btn s" onclick="openScales()">Grading &amp; Division Scale</button><button class="btn s" onclick="openGenSub()">General &amp; Subject Analysis</button><button class="btn s" onclick="openGender()">Gender &amp; Division Analysis</button><button class="btn s" onclick="examOverview()">Exam Overview</button><button class="btn s" onclick="openHelp()">Learners Needing Help</button></div><div class="card w" id="msheet">${sheetHtml(e)}</div>`;
return h}
async function addExam(){if(!xn.value.trim())return alert('Enter the examination name');const id=crypto.randomUUID(),cfg=normCfg({}),exp=+xe.value||100,nm=xn.value.trim(),r=await SB.from('exams').insert({id,school_id:ctx.sch,year:ctx.year,term:ctx.term,class_name:ctx.cls,name:nm,exp,config:cfg});
if(r.error)return alert('Not saved: '+r.error.message+' (has the examinations SQL file been run?)');S.exams.push({id,sch:ctx.sch,year:ctx.year,term:ctx.term,cls:ctx.cls,name:nm,exp,cfg,cat:new Date().toISOString()});ctx.x=id;render()}
async function setXM(eid,lid,si,el){const e=S.exams.find(x=>x.id==eid),sub=e.cfg.subjects[si].name,raw=el.value.trim();S.em[eid]??={};const m=(S.em[eid][lid]??={});
if(raw===''){const r=await SB.from('exam_marks').delete().eq('exam_id',eid).eq('learner_id',lid).eq('subject',sub);if(r.error){el.value=m[sub]??'';return alert('Not saved: '+r.error.message)}delete m[sub]}
else{const v=Math.round(+raw);if(!(v>=0)||v>e.exp){el.value=m[sub]??'';return alert(`Enter a mark from 0 to ${e.exp}`)}const r=await SB.from('exam_marks').upsert({exam_id:eid,learner_id:lid,subject:sub,mark:v});if(r.error){el.value=m[sub]??'';return alert('Not saved: '+r.error.message)}m[sub]=v;el.value=v}
const d=document.getElementById('msheet');if(d)d.innerHTML=sheetHtml(e)}
const saveCfg=e=>dbx(SB.from('exams').update({config:e.cfg}).eq('id',e.id),()=>{mdlg.style.display='none';render()});
function optX(k,v){const e=CX();e.cfg[k]=v;saveCfg(e)}
function editExam(){const e=CX(),mx=Math.max(0,...Object.values(S.em[e.id]||{}).flatMap(m=>Object.values(m)));form('Edit examination',[{l:'Examination name',v:e.name,w:1},{l:'Expected marks per subject',t:'number',v:e.exp}],v=>{const x=+v[1];if(!v[0].trim())return'Enter the name';if(!(x>=1))return'Expected marks must be 1 or more';if(x<mx)return`Some marks are already up to ${mx}, so expected marks cannot be lower.`;
dbx(SB.from('exams').update({name:v[0].trim(),exp:x}).eq('id',e.id),()=>{e.name=v[0].trim();e.exp=x;render()})})}
function delExam(){const e=CX();ask(`Delete "${e.name}" and all its marks?`,()=>dbx(SB.from('exams').delete().eq('id',e.id),()=>{S.exams=S.exams.filter(x=>x.id!=e.id);delete S.em[e.id];ctx.x='';render()}))}
const dlgBox=(t,body,save,extra='')=>{mdlg.innerHTML=`<div class="b" style="max-width:440px;max-height:88vh;overflow:auto"><h2>${t}</h2>${body}<p id="ferr" style="color:var(--bad);margin:8px 0 0;min-height:18px"></p><button class="btn" onclick="${save}">Save</button><button class="btn s" onclick="mdlg.style.display='none'">Cancel</button></div>`;mdlg.style.display='flex'};
const opt9=s=>[1,2,3,4,5,6,7,8,9].map(n=>`<option ${s==n?'selected':''}>${n}</option>`).join('');
const grow=r=>`<tr><td><input type="number" class="gf" value="${r.from??''}" style="width:80px"></td><td><input type="number" class="gtt" value="${r.to??''}" style="width:80px"></td><td><select class="ga"><option value=""></option>${opt9(r.agg)}</select></td></tr>`;
function openGrades(){const e=CX(),g=[...e.cfg.grades];while(g.length<5)g.push({});dlgBox('Grading (aggregates)',`<p style="margin:0 0 8px;color:var(--mu)">From and To are percentages of the marks. For example From 1 To 39 gives aggregate 9. You choose every row.</p><table id="gtab"><tr><th>From</th><th>To</th><th>Aggregate</th></tr>${g.map(grow).join('')}</table><button class="btn s" onclick="document.getElementById('gtab').insertAdjacentHTML('beforeend',grow({}))">+ Add row</button>`,'saveGrades()')}
function saveGrades(){const f=[...document.querySelectorAll('.gf')],t=[...document.querySelectorAll('.gtt')],a=[...document.querySelectorAll('.ga')],rows=[];
for(let i=0;i<f.length;i++){if(f[i].value===''&&t[i].value===''&&a[i].value==='')continue;if(f[i].value===''||t[i].value===''||a[i].value==='')return ferr.textContent='Fill From, To and Aggregate in every row you use';const r={from:+f[i].value,to:+t[i].value,agg:+a[i].value};if(r.from>r.to||r.from<0)return ferr.textContent='In each row From must not be bigger than To';rows.push(r)}
rows.sort((x,y)=>x.from-y.from);for(let i=1;i<rows.length;i++)if(rows[i].from<=rows[i-1].to)return ferr.textContent='Two rows overlap. Check the From and To numbers.';const e=CX();e.cfg.grades=rows;saveCfg(e)}
const drow=r=>`<tr><td><select class="dd">${['','1','2','3','4','U','X'].map(d=>`<option ${r.div==d?'selected':''}>${d}</option>`).join('')}</select></td><td><input type="number" class="df" value="${r.from??''}" style="width:80px"></td><td><input type="number" class="dtt" value="${r.to??''}" style="width:80px"></td></tr>`;
function openDivs(){const e=CX(),c=e.cfg,d=[...c.divs];while(d.length<5)d.push({});
const rules=c.push.rules&&c.push.rules.length?c.push.rules:[{to:c.push.to||'2',agg:c.push.agg||9,subs:c.push.subs||['English','Mathematics'],onlyFrom:['1']},{to:'3',agg:9,subs:c.push.subs||['English','Mathematics'],onlyFrom:null},{to:'4',agg:9,subs:c.push.subs||['English','Mathematics'],onlyFrom:null}];
const r0=rules.find(r=>String(r.to)==='2')||{to:'2',agg:9,subs:['English','Mathematics'],onlyFrom:['1']};
const r1=rules.find(r=>String(r.to)==='3')||{to:'3',agg:9,subs:[],onlyFrom:null};
const r2=rules.find(r=>String(r.to)==='4')||{to:'4',agg:9,subs:[],onlyFrom:null};
const subChecks=(cls,sel)=>c.subjects.map(s=>`<label class="ck"><input type="checkbox" class="${cls}" value="${esc(s.name)}" ${sel.includes(s.name)?'checked':''}>${esc(s.short)}</label>`).join('');
dlgBox('Divisions and push rules',`<p style="margin:0 0 8px;color:var(--mu)">Give the total aggregates for each division. Example: Division 1 from 4 to 12.</p><table id="dtab"><tr><th>Division</th><th>From T.AGG</th><th>To T.AGG</th></tr>${d.map(drow).join('')}</table><button class="btn s" onclick="document.getElementById('dtab').insertAdjacentHTML('beforeend',drow({}))">+ Add row</button>
<h2 style="margin-top:14px">Push rules (F9 / aggregate 9 in selected subjects)</h2>
<div style="border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px"><label class="ck"><input type="checkbox" id="p2on" ${r0.subs&&r0.subs.length?'checked':''}> <b>Push Division 1 → Division 2</b> when aggregate is 9 in selected subjects</label>
<label style="margin-top:6px">Subjects</label>${subChecks('ps2',r0.subs||[])}</div>
<div style="border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px"><label class="ck"><input type="checkbox" id="p3on" ${r1.subs&&r1.subs.length?'checked':''}> <b>Push to Division 3</b> when aggregate is 9 in selected subjects</label>
<label style="margin-top:6px">Subjects</label>${subChecks('ps3',r1.subs||[])}</div>
<div style="border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px"><label class="ck"><input type="checkbox" id="p4on" ${r2.subs&&r2.subs.length?'checked':''}> <b>Push to Division 4</b> when aggregate is 9 in selected subjects</label>
<label style="margin-top:6px">Subjects</label>${subChecks('ps4',r2.subs||[])}</div>
<div><button class="btn s" onclick="document.querySelectorAll('.ps2,.ps3,.ps4').forEach(x=>x.checked=['English','Mathematics'].includes(x.value))">ENG and MTC only (all rules)</button>
<button class="btn s" onclick="document.querySelectorAll('.ps2,.ps3,.ps4').forEach(x=>x.checked=true)">All subjects (all rules)</button></div>
<p style="margin:8px 0 0;color:var(--mu)">A learner with a missing mark gets X. A total outside every range gets U. The most severe applicable push is applied.</p>`,'saveDivs()')}
function saveDivs(){const d=[...document.querySelectorAll('.dd')],f=[...document.querySelectorAll('.df')],t=[...document.querySelectorAll('.dtt')],rows=[];
for(let i=0;i<d.length;i++){if(d[i].value===''&&f[i].value===''&&t[i].value==='')continue;if(d[i].value===''||f[i].value===''||t[i].value==='')return ferr.textContent='Fill Division, From and To in every row you use';const r={div:d[i].value,from:+f[i].value,to:+t[i].value};if(r.from>r.to)return ferr.textContent='In each row From must not be bigger than To';rows.push(r)}
const e=CX();e.cfg.divs=rows;
const pick=cls=>[...document.querySelectorAll('.'+cls+':checked')].map(x=>x.value);
const rules=[];
if(document.getElementById('p2on').checked){const s=pick('ps2');if(s.length)rules.push({to:'2',agg:9,subs:s,onlyFrom:['1']})}
if(document.getElementById('p3on').checked){const s=pick('ps3');if(s.length)rules.push({to:'3',agg:9,subs:s,onlyFrom:null})}
if(document.getElementById('p4on').checked){const s=pick('ps4');if(s.length)rules.push({to:'4',agg:9,subs:s,onlyFrom:null})}
e.cfg.push={agg:9,to:rules[0]?rules[0].to:'none',subs:rules[0]?rules[0].subs:[],rules};
saveCfg(e)}
function openSubs(){SB2=CX().cfg.subjects.map(s=>({...s}));drawSubs()}
function drawSubs(){mdlg.innerHTML=`<div class="b" style="max-width:480px;max-height:88vh;overflow:auto"><h2>Subjects on the MarkSheet</h2><p style="margin:0 0 8px;color:var(--mu)">The four core subjects are compulsory. Add others with a short name. Tick Agg for subjects whose aggregate counts in T.AGG. Drag a row by the ☰ handle to change the order, or use the arrows.</p>
<datalist id="sdl">${S.subjects.map(x=>`<option>${esc(x)}`).join('')}</datalist><div id="slist">${SB2.map((s,i)=>`<div class="srow" draggable="true" data-i="${i}" style="display:flex;gap:6px;align-items:center;margin-bottom:6px;padding:4px;border:1px solid var(--bd);border-radius:6px;cursor:grab" ondragstart="dragS(event,${i})" ondragover="event.preventDefault()" ondrop="dropS(event,${i})"><span style="cursor:grab;user-select:none;padding:0 4px;color:var(--mu)">☰</span><button class="btn s" style="margin:0;padding:4px 8px" onclick="mvS(${i},-1)">▲</button><button class="btn s" style="margin:0;padding:4px 8px" onclick="mvS(${i},1)">▼</button><input class="sn" list="sdl" value="${esc(s.name)}" ${s.core?'readonly':''} style="flex:1;min-width:0" placeholder="Subject"><input class="ss" value="${esc(s.short)}" style="width:68px" placeholder="Short"><label class="ck" style="margin:0"><input type="checkbox" class="sc" ${s.count?'checked':''}>Agg</label>${s.core?'':`<button class="x" onclick="rmS(${i})">✕</button>`}</div>`).join('')}</div>
<button class="btn s" onclick="addS()">+ Add subject</button><p id="ferr" style="color:var(--bad);margin:8px 0 0;min-height:18px"></p><button class="btn" onclick="saveSubs()">Save</button><button class="btn s" onclick="mdlg.style.display='none'">Cancel</button></div>`;mdlg.style.display='flex'}
let _dragI=null;function dragS(ev,i){_dragI=i;ev.dataTransfer.effectAllowed='move'}
function dropS(ev,j){ev.preventDefault();if(_dragI==null||_dragI===j)return;syncS();const item=SB2.splice(_dragI,1)[0];SB2.splice(j,0,item);_dragI=null;drawSubs()}
function syncS(){const n=[...document.querySelectorAll('.sn')],h=[...document.querySelectorAll('.ss')],c=[...document.querySelectorAll('.sc')];SB2.forEach((s,i)=>{s.name=n[i].value.trim();s.short=h[i].value.trim();s.count=c[i].checked})}
const mvS=(i,d)=>{syncS();const j=i+d;if(j<0||j>=SB2.length)return;[SB2[i],SB2[j]]=[SB2[j],SB2[i]];drawSubs()},rmS=i=>{syncS();SB2.splice(i,1);drawSubs()},addS=()=>{syncS();SB2.push({name:'',short:'',count:false});drawSubs()};
function saveSubs(){syncS();if(SB2.some(s=>!s.name||!s.short))return ferr.textContent='Every subject needs a name and a short name';if(new Set(SB2.map(s=>s.name.toLowerCase())).size<SB2.length)return ferr.textContent='A subject is listed twice';const e=CX();e.cfg.subjects=SB2;saveCfg(e)}
